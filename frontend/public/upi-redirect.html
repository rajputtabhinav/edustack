<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduStack Payment</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0f1a;
        color: #f8fafc;
      }

      .card {
        width: min(420px, calc(100vw - 32px));
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(18px);
        border-radius: 28px;
        padding: 28px 24px;
        box-shadow: 0 18px 40px rgba(2, 6, 23, 0.32);
      }

      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.48);
      }

      h1 {
        margin: 14px 0 0;
        font-size: 28px;
        line-height: 1.15;
      }

      p {
        margin: 12px 0 0;
        color: rgba(255, 255, 255, 0.7);
        font-size: 14px;
        line-height: 1.6;
      }

      .amount {
        margin-top: 18px;
        font-size: 18px;
        font-weight: 700;
        color: #d1fae5;
      }

      .actions {
        margin-top: 22px;
        display: grid;
        gap: 12px;
      }

      button,
      a {
        border: 0;
        text-decoration: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        border-radius: 999px;
        padding: 14px 18px;
        font-size: 14px;
        font-weight: 700;
      }

      .primary {
        background: linear-gradient(90deg, #0ea5e9, #22d3ee);
        color: white;
        box-shadow: 0 14px 30px rgba(34, 211, 238, 0.18);
      }

      .secondary {
        background: rgba(255, 255, 255, 0.05);
        color: #f8fafc;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .note {
        margin-top: 18px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="eyebrow">EduStack Payment</div>
      <h1>Open your UPI app to complete payment</h1>
      <p id="route-label">Preparing secure payment route...</p>
      <div class="amount" id="amount">Amount: --</div>
      <div class="actions">
        <a id="pay-now" class="primary" href="#">Open UPI App</a>
        <button id="try-again" class="secondary" type="button">Try Again</button>
      </div>
      <p class="note">If no payment app opens, return to Telegram and use the alternate payment route.</p>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const pa = params.get("pa") || "";
      const am = params.get("am") || "";
      const pn = params.get("pn") || "EduStack";
      const label = params.get("label") || "UPI Route";
      const isAndroid = /Android/i.test(window.navigator.userAgent || "");

      const upiUrl = `upi://pay?pa=${encodeURIComponent(pa)}&pn=${encodeURIComponent(pn)}&am=${encodeURIComponent(am)}&cu=INR`;
      const intentUrl = `intent://pay?pa=${encodeURIComponent(pa)}&pn=${encodeURIComponent(pn)}&am=${encodeURIComponent(am)}&cu=INR#Intent;scheme=upi;end`;

      document.getElementById("route-label").textContent = `${label} is ready`;
      document.getElementById("amount").textContent = `Amount: Rs.${am || "--"}`;

      function openPayment() {
        window.location.href = isAndroid ? intentUrl : upiUrl;
      }

      document.getElementById("pay-now").addEventListener("click", function (event) {
        event.preventDefault();
        openPayment();
      });

      document.getElementById("try-again").addEventListener("click", openPayment);

      setTimeout(openPayment, 250);
    </script>
  </body>
</html>
